name: warrantyvault
description: WarrantyVault - keep every warranty, receipt and expiry reminder in one safe place.
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Local database, files and settings
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3
  archive: ^3.6.1
  intl: ^0.20.2

  # Photos, receipt scanning and PDF
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.14.0
  pdf: ^3.11.1
  printing: ^5.13.4
  share_plus: ^10.1.4

  # Security
  local_auth: ^2.3.0

  # Expiry reminders
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0

  # Google Drive backup / restore
  google_sign_in: ^6.2.2
  googleapis: ^13.2.0
  http: ^1.2.2

dev_dependencies:
    flutter_test:
      sdk: flutter
    flutter_lints: ^5.0.0
    sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
